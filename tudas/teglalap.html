<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Téglalap</title>
  </head>
  <body>
    <style>
      .teglalap {
        width: 100px;
        /* height: 25px; */
        aspect-ratio: 16/9;
        background: red;
        border: 2px solid blue;
        border-radius: 2rem;
        border-top-left-radius: 1rem;
        opacity: 1; /* Átlátszóság (0-1) */
        box-shadow: 5px 5px 0 0 black; /* X Y ELMOSÁS NAGYÍTÁS SZÍN */
        box-shadow: 0 0 25px green;
      }
    </style>

    <div class="teglalap"></div>
  </body>
</html>
