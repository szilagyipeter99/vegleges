<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid és Flexbox</title>
  </head>
  <body>
    <style>
      .matrica {
        height: 50px;
        width: fit-content;
        background-color: yellow;
        padding: 0.5rem; /* Belső margó */
        font-size: 2rem;
      }
      .matrica-flex {
        display: flex;
        flex-direction: row;
        gap: 1rem;
      }
      .matrica-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr; /* lehetne ez is: repeat(3, 1fr); */
      }
    </style>

    <!-- Több matrica flexbox-ban: -->
    <div class="matrica-flex">
      <div class="matrica">@__1</div>
      <div class="matrica">@____2</div>
      <div class="matrica">@_3</div>
    </div>

    <br />
    <!-- Több matrica grid-ben: -->
    <div class="matrica-grid">
      <div class="matrica">@__1</div>
      <div class="matrica">@____2</div>
      <div class="matrica">@_3</div>
    </div>
  </body>
</html>
